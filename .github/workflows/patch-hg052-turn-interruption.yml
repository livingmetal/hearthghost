name: HG-052 one-shot user turn patch

on:
  push:
    branches:
      - codex/hg-052-dialogue-performance-timeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hg-052-dialogue-performance-timeline
      - name: Apply user-turn patch
        run: python .github/scripts/hg052_turn_patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src/main.ts apps/web-client/src/windows-main.ts
          git commit -m "HG-052: react during thinking and cancel stale performances"
          git push origin HEAD:codex/hg-052-dialogue-performance-timeline
