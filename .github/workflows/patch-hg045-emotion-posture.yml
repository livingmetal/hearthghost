name: patch-hg045-emotion-posture

on:
  push:
    branches:
      - codex/hg-045-emotion-posture

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'HG-045: wire emotion posture into renderer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hg-045-emotion-posture
      - name: Patch renderer
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web-client/src/character/vrm-renderer.ts")
          text = path.read_text()
          replacements = [
              (
                  'import { NaturalPostureController, type VrmPostureFrame } from "./vrm-posture.js";\n',
                  'import { NaturalPostureController, type VrmPostureFrame } from "./vrm-posture.js";\n'
                  'import { EmotionPostureController } from "./vrm-emotion-posture.js";\n',
              ),
              (
                  '  private readonly posture: NaturalPostureController;\n  private renderer: WebGLRenderer | null = null;\n',
                  '  private readonly posture: NaturalPostureController;\n'
                  '  private readonly emotionPosture: EmotionPostureController;\n'
                  '  private renderer: WebGLRenderer | null = null;\n',
              ),
              (
                  '    this.posture = new NaturalPostureController(characterId);\n    this.camera.position.set(\n',
                  '    this.posture = new NaturalPostureController(characterId);\n'
                  '    this.emotionPosture = new EmotionPostureController(characterId);\n'
                  '    this.camera.position.set(\n',
              ),
              (
                  '    this.posture.reset(this.elapsed);\n    this.gestureQueue.length = 0;\n',
                  '    this.posture.reset(this.elapsed);\n'
                  '    this.emotionPosture.reset();\n'
                  '    this.gestureQueue.length = 0;\n',
              ),
              (
                  '      this.applyPosture(this.posture.update(delta, this.elapsed, this.presentation.state));\n      this.applyRelaxedHands();\n',
                  '      this.applyPosture(this.posture.update(delta, this.elapsed, this.presentation.state));\n'
                  '      this.applyPosture(this.emotionPosture.update(\n'
                  '        delta,\n'
                  '        this.presentation.state,\n'
                  '        this.presentation.emotion,\n'
                  '      ));\n'
                  '      this.applyRelaxedHands();\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one renderer match, got {count}: {old[:80]!r}")
              text = text.replace(old, new)
          path.write_text(text)
      - name: Commit renderer wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src/character/vrm-renderer.ts
          git commit -m "HG-045: wire emotion posture into renderer"
          git push origin HEAD:codex/hg-045-emotion-posture
