name: patch-hg039-hand

on:
  push:
    branches:
      - codex/hg-039-natural-idle-motion

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply hand pose layer') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Patch shared VRM renderer
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/web-client/src/character/vrm-renderer.ts")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'import { VRM_CAMERA_FRAMING } from "./vrm-framing.js";\n',
                  'import {\n'
                  '  FINGER_BONE_NAMES,\n'
                  '  fingerBonesForSide,\n'
                  '  handPoseDelta,\n'
                  '  handPoseRotation,\n'
                  '} from "./vrm-hand-pose.js";\n'
                  'import { VRM_CAMERA_FRAMING } from "./vrm-framing.js";\n',
              ),
              (
                  '  "rightUpperLeg",\n  "rightLowerLeg",\n] as const;\n',
                  '  "rightUpperLeg",\n  "rightLowerLeg",\n  ...FINGER_BONE_NAMES,\n] as const;\n',
              ),
              (
                  '      this.updateBodyMotion(this.presentation.state);\n      this.updateGesture();\n',
                  '      this.updateBodyMotion(this.presentation.state);\n'
                  '      this.applyRelaxedHands();\n'
                  '      this.updateGesture();\n',
              ),
              (
                  '  private offsetBoneTuple(name: DrivenBoneName, rotation: RotationTuple): void {\n',
                  '  private applyRelaxedHands(): void {\n'
                  '    for (const side of ["left", "right"] as const) {\n'
                  '      for (const name of fingerBonesForSide(side)) {\n'
                  '        const rotation = handPoseRotation(name, "relaxed");\n'
                  '        this.offsetBoneRotation(name, rotation[0], rotation[1], rotation[2]);\n'
                  '      }\n'
                  '    }\n'
                  '  }\n\n'
                  '  private openHand(side: CharacterSide, amount: number): void {\n'
                  '    const blend = Math.max(0, Math.min(1, amount));\n'
                  '    for (const name of fingerBonesForSide(side)) {\n'
                  '      const delta = handPoseDelta(name, "relaxed", "open");\n'
                  '      this.offsetBoneRotation(\n'
                  '        name,\n'
                  '        delta[0] * blend,\n'
                  '        delta[1] * blend,\n'
                  '        delta[2] * blend,\n'
                  '      );\n'
                  '    }\n'
                  '  }\n\n'
                  '  private offsetBoneTuple(name: DrivenBoneName, rotation: RotationTuple): void {\n',
              ),
              (
                  '    this.offsetBoneRotation(\n'
                  '      hand,\n'
                  '      0.08 * amount,\n'
                  '      -sign * 0.06 * amount,\n'
                  '      sign * 0.04 * amount,\n'
                  '    );\n'
                  '    this.offsetBoneRotation("chest", 0, 0, -sign * 0.025 * amount);\n',
                  '    this.offsetBoneRotation(\n'
                  '      hand,\n'
                  '      0.08 * amount,\n'
                  '      -sign * 0.06 * amount,\n'
                  '      sign * 0.04 * amount,\n'
                  '    );\n'
                  '    this.openHand(side, amount);\n'
                  '    this.offsetBoneRotation("chest", 0, 0, -sign * 0.025 * amount);\n',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected renderer anchor not found: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit renderer patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src/character/vrm-renderer.ts
          git commit -m "HG-039: apply hand pose layer"
          git push origin HEAD:codex/hg-039-natural-idle-motion
