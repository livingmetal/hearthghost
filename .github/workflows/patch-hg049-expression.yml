name: patch-hg049-expression

on:
  push:
    branches:
      - codex/hg-049-expression-composer

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/hg-049-expression-composer
      - name: Patch renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/web-client/src/character/vrm-renderer.ts")
          text = path.read_text()

          if 'import { VrmExpressionComposer } from "./vrm-expression-composer.js";' not in text:
              marker = 'import { actionMotionFrame, type VrmActionMotionFrame } from "./vrm-action-motion.js";\n'
              if marker not in text:
                  raise SystemExit("action motion import marker missing")
              text = text.replace(
                  marker,
                  marker + 'import { VrmExpressionComposer } from "./vrm-expression-composer.js";\n',
                  1,
              )

          text = text.replace('  CharacterEmotion,\n', '', 1)

          text, count = re.subn(
              r'\nconst EMOTION_EXPRESSION_TARGETS:[\s\S]*?\n\}\);\n\nexport class VrmCharacterRenderer',
              '\nexport class VrmCharacterRenderer',
              text,
              count=1,
          )
          if count == 0 and 'const EMOTION_EXPRESSION_TARGETS' in text:
              raise SystemExit("emotion target block was not removed")

          text = text.replace(
              '  private readonly expressionValues = new Map<string, number>();\n',
              '',
              1,
          )
          if '  private readonly expressionComposer: VrmExpressionComposer;\n' not in text:
              marker = '  private readonly gaze: GazeBehaviorController;\n'
              if marker not in text:
                  raise SystemExit("gaze field marker missing")
              text = text.replace(
                  marker,
                  marker + '  private readonly expressionComposer: VrmExpressionComposer;\n',
                  1,
              )

          if '    this.expressionComposer = new VrmExpressionComposer(characterId);\n' not in text:
              marker = '    this.gaze = new GazeBehaviorController(characterId);\n'
              if marker not in text:
                  raise SystemExit("gaze constructor marker missing")
              text = text.replace(
                  marker,
                  marker + '    this.expressionComposer = new VrmExpressionComposer(characterId);\n',
                  1,
              )

          text = text.replace('    this.expressionValues.clear();\n', '', 1)

          load_marker = '    this.indexExpressions(vrm);\n'
          load_new = (
              '    this.indexExpressions(vrm);\n'
              '    this.expressionComposer.reset();\n'
              '    this.expressionComposer.setCapabilities(this.expressionNames.keys());\n'
          )
          if load_new not in text:
              if load_marker not in text:
                  raise SystemExit("expression index marker missing")
              text = text.replace(load_marker, load_new, 1)

          old_method = '''  private updateExpressions(delta: number): void {\n    const target = EMOTION_EXPRESSION_TARGETS[this.presentation.emotion]\n      ?? EMOTION_EXPRESSION_TARGETS.neutral;\n    for (const name of ["happy", "relaxed", "surprised", "sad"] as const) {\n      const from = this.expressionValues.get(name) ?? 0;\n      const to = target[name] ?? 0;\n      const blend = 1 - Math.exp(-7 * delta);\n      const value = from + (to - from) * blend;\n      this.expressionValues.set(name, value);\n      this.setExpression(name, value);\n    }\n  }\n'''
          new_method = '''  private updateExpressions(delta: number): void {\n    const frame = this.expressionComposer.update(\n      delta,\n      this.presentation.state,\n      this.presentation.emotion,\n    );\n    for (const [name, value] of frame) {\n      this.setExpression(name, value);\n    }\n  }\n'''
          if new_method not in text:
              if old_method not in text:
                  raise SystemExit("old updateExpressions method missing")
              text = text.replace(old_method, new_method, 1)

          path.write_text(text)
          PY
      - name: Commit renderer wiring
        run: |
          if git diff --quiet -- apps/web-client/src/character/vrm-renderer.ts; then
            echo "Renderer already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src/character/vrm-renderer.ts
          git commit -m "HG-049: wire expression composer into renderer"
          git push origin HEAD:codex/hg-049-expression-composer
