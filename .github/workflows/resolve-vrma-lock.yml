name: resolve-vrma-lock

on:
  push:
    branches:
      - codex/hg-039-natural-idle-motion

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, 'lock VRM animation runtime') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve exact npm lock metadata
        working-directory: apps/web-client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit resolved lockfile
        shell: bash
        run: |
          if git diff --quiet -- apps/web-client/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/package-lock.json
          git commit -m "HG-039: lock VRM animation runtime"
          git push origin HEAD:codex/hg-039-natural-idle-motion
