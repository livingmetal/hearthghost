name: HG-056 one-shot migration dedupe

on:
  push:
    branches:
      - codex/hg-056-durable-tool-security

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hg-056-durable-tool-security
      - name: Remove duplicate migration block
        run: python .github/scripts/hg056_dedupe_migration.py
      - name: Validate patch
        run: git diff --check
      - name: Commit migration cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/assistant/src/adapters/postgres_schema.py
          git commit -m "HG-056: remove duplicate replay migration definition"
          git push origin HEAD:codex/hg-056-durable-tool-security
