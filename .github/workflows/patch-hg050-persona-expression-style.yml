name: HG-050 one-shot persona expression-style patch

on:
  push:
    branches:
      - codex/hg-050-persona-expression-style

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hg-050-persona-expression-style
          fetch-depth: 3
      - name: Extract and run staged patch
        shell: bash
        run: |
          git show a0fb7b6357503e669aea9d8cbe4f5fc52a4bea8e:.github/workflows/patch-hg050-persona-expression-style.yml > /tmp/hg050-staged.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/hg050-staged.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          marker = '# Renderer-neutral style ID contract.'
          flexible = r'''
          import textwrap

          def replace_once(path, old, new):
              text = read(path)
              if old in text:
                  write(path, text.replace(old, new, 1))
                  return
              old_lines = old.strip('\n').splitlines()
              wanted = [line.strip() for line in old_lines]
              lines = text.splitlines()
              for index in range(0, len(lines) - len(old_lines) + 1):
                  window = lines[index:index + len(old_lines)]
                  if [line.strip() for line in window] != wanted:
                      continue
                  first = next((line for line in window if line.strip()), '')
                  indent = first[:len(first) - len(first.lstrip())]
                  replacement = textwrap.dedent(new).strip('\n').splitlines()
                  rendered = '\n'.join(
                      (indent + line if line.strip() else '')
                      for line in replacement
                  )
                  before = '\n'.join(lines[:index])
                  after = '\n'.join(lines[index + len(old_lines):])
                  prefix = (before + '\n') if before else ''
                  suffix = ('\n' + after) if after else ''
                  write(path, prefix + rendered + suffix + ('\n' if text.endswith('\n') else ''))
                  return
              raise RuntimeError(f'expected patch anchor missing: {path}: {old[:80]!r}')

          '''
          code = code.replace(marker, flexible + marker, 1)
          exec(compile(code, '<hg050-staged-patch>', 'exec'))
          PY
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps tests
          git diff --cached --check
          git commit -m "HG-050: wire persona expression style"
          git push origin HEAD:codex/hg-050-persona-expression-style
