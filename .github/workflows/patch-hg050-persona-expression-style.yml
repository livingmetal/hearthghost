name: HG-050 one-shot persona expression-style patch

on:
  push:
    branches:
      - codex/hg-050-persona-expression-style

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hg-050-persona-expression-style
          fetch-depth: 2
      - name: Extract and run staged patch
        shell: bash
        run: |
          git show HEAD^:.github/workflows/patch-hg050-persona-expression-style.yml > /tmp/hg050-staged.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/hg050-staged.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(code, '<hg050-staged-patch>', 'exec'))
          PY
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps tests
          git diff --cached --check
          git commit -m "HG-050: wire persona expression style"
          git push origin HEAD:codex/hg-050-persona-expression-style
