name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python security and runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build Python test image
        run: docker build --target test --tag hearthghost-python-test .
      - name: Run Python tests without network
        run: docker run --rm --network none hearthghost-python-test

  client:
    name: TypeScript and client tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build client test image
        run: docker build --target client-test --tag hearthghost-client-test .
      - name: Run packaged client tests without network
        run: docker run --rm --network none hearthghost-client-test

  android:
    name: Android unit lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build pinned Android toolchain and APK
        run: docker build --file containers/android/Containerfile --tag hearthghost-android-build .
      - name: Verify final image runs without network
        run: docker run --rm --network none hearthghost-android-build

  windows:
    name: Windows WebView2 client build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Restore Windows client
        run: dotnet restore apps/windows-client/HearthGhost.WindowsClient.csproj
      - name: Build Windows client
        run: dotnet build apps/windows-client/HearthGhost.WindowsClient.csproj --configuration Release --no-restore -warnaserror
      - name: Validate Windows development launcher syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "apps/windows-client/scripts/Start-HearthGhost.ps1",
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
          }
