name: patch-hg039-posture

on:
  push:
    branches:
      - codex/hg-039-natural-idle-motion

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply character posture profiles') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Patch renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web-client/src/character/vrm-renderer.ts")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'import type { CharacterRenderer } from "./renderer.js";\n',
                  'import type { HearthGhostCharacterId } from "./catalog.js";\n'
                  'import type { CharacterRenderer } from "./renderer.js";\n',
              ),
              (
                  'import { VrmViewManipulation, type VrmViewState } from "./vrm-view-manipulation.js";\n',
                  'import { VrmViewManipulation, type VrmViewState } from "./vrm-view-manipulation.js";\n'
                  'import { NaturalPostureController, type VrmPostureFrame } from "./vrm-posture.js";\n',
              ),
              (
                  '  private readonly baseMotion = new ProceduralIdleBaseMotion();\n  private renderer: WebGLRenderer | null = null;\n',
                  '  private readonly baseMotion = new ProceduralIdleBaseMotion();\n'
                  '  private readonly posture: NaturalPostureController;\n'
                  '  private renderer: WebGLRenderer | null = null;\n',
              ),
              (
                  '  constructor(private readonly assetUrl: string | null = null) {\n    this.camera.position.set(\n',
                  '  constructor(\n'
                  '    private readonly assetUrl: string | null = null,\n'
                  '    characterId: HearthGhostCharacterId | null = null,\n'
                  '  ) {\n'
                  '    this.posture = new NaturalPostureController(characterId);\n'
                  '    this.camera.position.set(\n',
              ),
              (
                  '    this.baseMotion.reset(this.elapsed);\n    this.gestureQueue.length = 0;\n',
                  '    this.baseMotion.reset(this.elapsed);\n'
                  '    this.posture.reset(this.elapsed);\n'
                  '    this.gestureQueue.length = 0;\n',
              ),
              (
                  '      this.updateBodyMotion(this.presentation.state);\n      this.applyRelaxedHands();\n',
                  '      this.updateBodyMotion(this.presentation.state);\n'
                  '      this.applyPosture(this.posture.update(delta, this.elapsed, this.presentation.state));\n'
                  '      this.applyRelaxedHands();\n',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected renderer anchor not found: {old[:100]!r}")
              text = text.replace(old, new, 1)

          start = text.index('  private updateBodyMotion(state: CharacterState): void {\n')
          end = text.index('  private applyBaseMotion(frame: VrmBaseMotionFrame): void {\n', start)
          new_body = '''  private updateBodyMotion(state: CharacterState): void {
            const activity = state === "speaking"
              ? 1.18
              : state === "noticing"
                ? 1.02
                : state === "sleeping"
                  ? 0.22
                  : 0.68;
            const breath = Math.sin(this.elapsed * 1.8) * 0.010 * activity;
            const upperBodySway = Math.sin(this.elapsed * 0.70) * 0.0035 * activity;
            const speakingNod = state === "speaking" ? Math.sin(this.elapsed * 3.2) * 0.009 : 0;
            const sleepingDrop = state === "sleeping" ? 0.045 : 0;

            this.offsetBoneRotation("hips", 0, upperBodySway * 0.16, 0);
            this.offsetBoneRotation("spine", breath * 0.45, upperBodySway * 0.22, -upperBodySway * 0.16);
            this.offsetBoneRotation("chest", breath, upperBodySway * 0.34, upperBodySway * 0.24);
            this.offsetBoneRotation("neck", sleepingDrop * 0.28, -upperBodySway * 0.20, 0);
            this.offsetBoneRotation("head", sleepingDrop + speakingNod, -upperBodySway * 0.34, 0);

            if (state === "speaking") {
              const conversationalLift = Math.sin(this.elapsed * 1.15 + 0.4) * 0.012;
              this.offsetBoneRotation("leftUpperArm", 0.018 + conversationalLift, 0, 0);
              this.offsetBoneRotation("rightUpperArm", -0.014 - conversationalLift * 0.75, 0, 0);
              this.offsetBoneRotation("leftLowerArm", -0.030, 0, 0);
              this.offsetBoneRotation("rightLowerArm", -0.022, 0, 0);
            }
          }

          '''
          text = text[:start] + new_body + text[end:]

          thinking_start = text.find('  private applyThinkingPose(): void {\n')
          if thinking_start != -1:
              thinking_end = text.index('  private applyRelaxedHands(): void {\n', thinking_start)
              text = text[:thinking_start] + text[thinking_end:]

          anchor = '  private applyRelaxedHands(): void {\n'
          posture_method = '''  private applyPosture(frame: VrmPostureFrame): void {
            this.offsetBoneTuple("spine", frame.spine);
            this.offsetBoneTuple("chest", frame.chest);
            this.offsetBoneTuple("neck", frame.neck);
            this.offsetBoneTuple("head", frame.head);
            this.offsetBoneTuple("leftShoulder", frame.leftShoulder);
            this.offsetBoneTuple("rightShoulder", frame.rightShoulder);
            this.offsetBoneTuple("leftUpperArm", frame.leftUpperArm);
            this.offsetBoneTuple("rightUpperArm", frame.rightUpperArm);
            this.offsetBoneTuple("leftLowerArm", frame.leftLowerArm);
            this.offsetBoneTuple("rightLowerArm", frame.rightLowerArm);
            this.offsetBoneTuple("leftHand", frame.leftHand);
            this.offsetBoneTuple("rightHand", frame.rightHand);
          }

          '''
          if anchor not in text:
              raise SystemExit("applyRelaxedHands anchor not found")
          text = text.replace(anchor, posture_method + anchor, 1)

          old_factory = '''export async function createVrmCharacterRenderer(
            assetUrl: string | null = null,
          ): Promise<CharacterRenderer> {
            return new VrmCharacterRenderer(assetUrl);
          }
          '''
          if old_factory not in text:
              raise SystemExit("renderer factory anchor not found")
          new_factory = '''export async function createVrmCharacterRenderer(
            assetUrl: string | null = null,
            characterId: HearthGhostCharacterId | null = null,
          ): Promise<CharacterRenderer> {
            return new VrmCharacterRenderer(assetUrl, characterId);
          }
          '''
          text = text.replace(old_factory, new_factory, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit renderer patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-client/src/character/vrm-renderer.ts
          git commit -m "HG-039: apply character posture profiles"
          git push origin HEAD:codex/hg-039-natural-idle-motion
