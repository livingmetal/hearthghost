name: hearthghost

services:
  core:
    profiles:
      - runtime
    image: hearthghost-core:local
    build:
      context: .
      dockerfile: Dockerfile
      target: core
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - apps.assistant.src.runtime.healthcheck
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s

  test:
    image: hearthghost-test:local
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    command:
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -p
      - test_*.py
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  client-test:
    image: hearthghost-client-test:local
    build:
      context: .
      dockerfile: Dockerfile
      target: client-test
    command:
      - node
      - --test
      - tests/client-node.test.mjs
      - tests/character-presentation.test.mjs
      - tests/conversation-controller.test.mjs
      - tests/conversation-protocol.test.mjs
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  walking-skeleton:
    image: hearthghost-walking-skeleton:local
    build:
      context: .
      dockerfile: Dockerfile
      target: walking-skeleton
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  openai-smoke:
    profiles:
      - provider-smoke
    image: hearthghost-openai-smoke:local
    build:
      context: .
      dockerfile: Dockerfile
      target: openai-smoke
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/openai-api-key
      OPENAI_MODEL: gpt-5.6-luna
    secrets:
      - source: openai_api_key
        target: openai-api-key
        uid: "10001"
        gid: "10001"
        mode: 0400
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  openai_api_key:
    external: true
    name: hearthghost-openai-api-key
